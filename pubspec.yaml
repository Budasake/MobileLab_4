name: travel_mn
description: TRAVEL APP - Монголын аяллын газрууд (Лаб 3 + Лаб 4)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.0.0
  flutter_map: ^8.0.0
  latlong2: ^0.9.1
  http: ^1.2.0
  image_picker: ^1.1.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
